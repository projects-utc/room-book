server:
  port: ${PORT:8080}

# Các giá trị nhạy cảm KHÔNG có mặc định trong mã nguồn: phải cấp qua biến môi trường
# (xem backend/.env.example). Chạy thử trên máy: SPRING_PROFILES_ACTIVE=local (H2, không cần Oracle).
spring:
  application:
    name: odauday-stay-backend
  datasource:
    url: ${ORACLE_DB_URL}
    username: ${ORACLE_DB_USER}
    password: ${ORACLE_DB_PASSWORD}
    driver-class-name: oracle.jdbc.OracleDriver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 20000
      idle-timeout: 300000
      max-lifetime: 1200000
  jpa:
    database-platform: org.hibernate.dialect.OracleDialect
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

app:
  jwt:
    secret: ${APP_JWT_SECRET}          # >= 32 ký tự, sinh bằng: openssl rand -base64 48
    expiration-ms: 86400000
  cors:
    allowed-origins: ${APP_CORS_ORIGINS:http://localhost:5173,http://localhost:8080}
  seed:
    # Tạo tài khoản/dữ liệu demo khi DB trống. Mặc định TẮT; bật bằng APP_SEED_ENABLED=true
    # và bắt buộc đặt APP_SEED_PASSWORD (mật khẩu chung cho tài khoản demo).
    enabled: ${APP_SEED_ENABLED:false}
    password: ${APP_SEED_PASSWORD:}
