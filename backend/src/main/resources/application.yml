server:
  port: ${PORT:8080}

spring:
  application:
    name: odauday-stay-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:${ORACLE_DB_URL:jdbc:h2:file:./data/odauday;DB_CLOSE_DELAY=-1;MODE=Oracle;DEFAULT_NULL_ORDERING=HIGH}}
    username: ${SPRING_DATASOURCE_USERNAME:${ORACLE_DB_USER:sa}}
    password: ${SPRING_DATASOURCE_PASSWORD:${ORACLE_DB_PASSWORD:}}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 1
      initialization-fail-timeout: -1
      connection-timeout: 20000
      idle-timeout: 300000
      max-lifetime: 1200000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

app:
  jwt:
    secret: ${APP_JWT_SECRET:odaudaystaysecretkeyforjwttokengenerationshouldbelongenough256bit}
    expiration-ms: 86400000